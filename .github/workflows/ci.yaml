name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build NixOS system configuration
        run: nix build .#nixosConfigurations.nixos.config.system.build.toplevel

      - name: Free space before home-manager build
        if: always()
        run: |
          nix store gc
          df -h /

      - name: Build Home Manager configuration
        run: nix build .#homeConfigurations."wolfar@nixos".activationPackage
